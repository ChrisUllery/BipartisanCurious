<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BipartisanCurious</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #app {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
            grid-template-rows: minmax(0, 1fr) auto;
            height: 100%;
        }

        #map {
            grid-column: 1;
            grid-row: 1;
            width: 100%;
            height: 100%;
            min-height: 0;
        }

        #panel {
            grid-column: 2;
            grid-row: 1 / 3;
            box-sizing: border-box;
            padding: 24px;
            overflow-y: auto;
            border-left: 1px solid #ccc;
            background: white;
        }

        #panel h1 {
            margin-top: 0;
            margin-bottom: 4px;
            font-size: 24px;
        }

        #panel .subtitle {
            margin-top: 0;
            color: #555;
        }

        #panel .intro {
            line-height: 1.5;
            color: #444;
        }

        .member-name {
            margin-bottom: 4px;
            font-size: 24px;
        }

        .member-meta {
            margin-top: 0;
            margin-bottom: 28px;
            color: #555;
        }

        .section-label {
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.08em;
            color: #666;
        }

        .section-explainer {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 13px;
            line-height: 1.4;
            color: #666;
        }

        .period-control {
            margin: 0 0 24px;
        }

        .period-control label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.08em;
            color: #666;
        }

        .period-control select {
            box-sizing: border-box;
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #bbb;
            border-radius: 4px;
            background: white;
            font: inherit;
            color: #222;
        }

        .period-dates {
            margin-top: 6px;
            font-size: 12px;
            color: #777;
        }

        .no-period-data {
            margin: 18px 0;
            padding: 14px;
            background: #f2f2f2;
            line-height: 1.45;
            color: #444;
        }

        .methodology {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #bbb;
            font-size: 13px;
            line-height: 1.45;
            color: #444;
        }

        .methodology h3 {
            margin: 0 0 16px;
            font-size: 16px;
            color: #111;
        }

        .methodology p {
            margin: 0 0 14px;
        }

        .methodology strong {
            color: #222;
        }

        .stat {
            padding: 14px 0;
            border-top: 1px solid #ddd;
        }

        .stat:last-child {
            border-bottom: 1px solid #ddd;
        }

        .stat-label {
            margin-bottom: 5px;
            font-size: 14px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: bold;
        }

        .stat-detail {
            margin-top: 3px;
            font-size: 13px;
            color: #666;
        }

        .vacant {
            margin-top: 24px;
            padding: 14px;
            background: #f2f2f2;
        }

        .member-detail-button,
        .member-detail-back,
        .member-detail-more {
            box-sizing: border-box;
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #999;
            border-radius: 4px;
            background: white;
            font: inherit;
            font-weight: bold;
            color: #222;
            cursor: pointer;
        }

        .member-detail-button {
            margin-top: 22px;
        }

        .member-detail-back {
            margin-bottom: 22px;
        }

        .member-detail-more {
            margin-top: 18px;
        }

        .member-detail-button:hover,
        .member-detail-back:hover,
        .member-detail-more:hover {
            background: #f2f2f2;
        }

        .detail-controls {
            margin: 20px 0;
        }

        .detail-control {
            margin-bottom: 14px;
        }

        .detail-control label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.08em;
            color: #666;
        }

        .detail-control select,
        .detail-control input {
            box-sizing: border-box;
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #bbb;
            border-radius: 4px;
            background: white;
            font: inherit;
            color: #222;
        }

        .detail-search-help {
            margin-top: 5px;
            font-size: 11px;
            line-height: 1.35;
            color: #777;
        }

        .map-search-control {
            position: relative;
            width: min(420px, calc(100vw - 110px));
            font-family: Arial, sans-serif;
        }

        .map-search-input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #888;
            border-radius: 4px;
            background: white;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.28);
            font-size: 14px;
            line-height: 1.2;
            color: #222;
        }

        .map-search-input:focus {
            outline: 2px solid #555;
            outline-offset: 1px;
        }

        .map-search-results {
            display: none;
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #aaa;
            border-radius: 4px;
            background: white;
            box-shadow: 0 2px 7px rgba(0, 0, 0, 0.25);
            z-index: 1000;
        }

        .map-search-results.visible {
            display: block;
        }

        .map-search-result {
            display: block;
            box-sizing: border-box;
            width: 100%;
            padding: 10px 12px;
            border: 0;
            border-bottom: 1px solid #e3e3e3;
            background: white;
            font: inherit;
            text-align: left;
            color: #222;
            cursor: pointer;
        }

        .map-search-result:last-child {
            border-bottom: 0;
        }

        .map-search-result:hover,
        .map-search-result:focus {
            background: #f2f2f2;
            outline: none;
        }

        .map-search-result-name {
            display: block;
            font-weight: bold;
        }

        .map-search-result-meta {
            display: block;
            margin-top: 2px;
            font-size: 12px;
            color: #666;
        }

        .map-search-empty {
            padding: 10px 12px;
            font-size: 13px;
            color: #666;
        }

        .detail-total {
            margin: 0 0 16px;
            font-size: 13px;
            color: #666;
        }

        .detail-record {
            padding: 16px 0;
            border-top: 1px solid #ddd;
        }

        .detail-record:last-child {
            border-bottom: 1px solid #ddd;
        }

        .detail-record-meta {
            margin-bottom: 6px;
            font-size: 12px;
            color: #666;
        }

        .detail-record h4 {
            margin: 0 0 6px;
            font-size: 15px;
            line-height: 1.3;
        }

        .detail-question {
            margin: 0 0 8px;
            font-size: 13px;
            font-weight: bold;
            line-height: 1.35;
        }

        .detail-description {
            margin: 0 0 12px;
            font-size: 13px;
            line-height: 1.4;
            color: #444;
        }

        .detail-positions {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
            margin: 12px 0;
        }

        .detail-position {
            padding: 8px 4px;
            background: #f4f4f4;
            text-align: center;
        }

        .detail-position-label {
            display: block;
            min-height: 24px;
            margin-bottom: 4px;
            font-size: 10px;
            line-height: 1.2;
            color: #666;
        }

        .detail-position-value {
            font-size: 15px;
            font-weight: bold;
        }

        .detail-clerk-link {
            display: inline-block;
            margin-top: 3px;
            font-size: 12px;
            font-weight: bold;
        }

        .detail-status {
            margin: 18px 0;
            padding: 14px;
            background: #f2f2f2;
            font-size: 13px;
            line-height: 1.4;
            color: #444;
        }

        #history-chart {
            grid-column: 1;
            grid-row: 2;
            box-sizing: border-box;
            overflow-y: visible;
            padding: 16px 22px 18px;
            border-top: 1px solid #ccc;
            background: white;
        }

        .history-empty {
            color: #666;
            font-size: 13px;
        }

        .history-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 14px;
        }

        .history-title {
            margin: 0 0 3px;
            font-size: 16px;
        }

        .history-subtitle {
            margin: 0;
            font-size: 12px;
            color: #666;
        }

        .history-view-control {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 0 0 auto;
        }

        .history-view-control label {
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.05em;
            color: #666;
        }

        .history-view-control select {
            padding: 6px 8px;
            border: 1px solid #bbb;
            border-radius: 4px;
            background: white;
            font: inherit;
        }

        .history-bars {
            display: grid;
            gap: 8px;
        }

        .history-row {
            display: grid;
            grid-template-columns: 125px minmax(120px, 1fr) 92px;
            align-items: center;
            gap: 10px;
        }

        .history-row-label {
            overflow: hidden;
            font-size: 12px;
            font-weight: bold;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-bar {
            display: flex;
            height: 18px;
            overflow: hidden;
            border-radius: 3px;
            background: #e5e5e5;
        }

        .history-segment {
            height: 100%;
        }

        .history-segment.with-party.party-r,
        .history-segment.against-party.party-d {
            background: #c94b4b;
        }

        .history-segment.with-party.party-d,
        .history-segment.against-party.party-r {
            background: #4b72c9;
        }

        .history-segment.with-party.party-i {
            background: #777;
        }

        .history-segment.against-party.party-i {
            background: #bbb;
        }

        .history-row-value {
            font-size: 12px;
            text-align: right;
            white-space: nowrap;
        }

        .history-row-value strong {
            font-size: 13px;
        }

        .history-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 12px;
            font-size: 11px;
            color: #666;
        }

        .history-legend-item {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .history-swatch {
            width: 11px;
            height: 11px;
            border-radius: 2px;
        }

        @media (max-width: 800px) {
            html,
            body {
                height: auto;
                min-height: 100%;
            }

            #app {
                grid-template-columns: 1fr;
                grid-template-rows: 55vh auto auto;
                height: auto;
                min-height: 100vh;
            }

            #map {
                grid-column: 1;
                grid-row: 1;
            }

            #history-chart {
                grid-column: 1;
                grid-row: 2;
                max-height: none;
            }

            #panel {
                grid-column: 1;
                grid-row: 3;
                overflow-y: visible;
                border-left: 0;
                border-top: 1px solid #ccc;
            }

            .history-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .history-row {
                grid-template-columns: 82px minmax(90px, 1fr) 76px;
                gap: 7px;
            }
        }
        .leaflet-interactive:focus {
            outline: none;
        }

    </style>
</head>

<body>

<div id="app">
    <div id="map"></div>

    <section id="history-chart">
        <div class="history-empty">
            Select a congressional district to view its voting
            record over time.
        </div>
    </section>

    <aside id="panel">
        <h1>BipartisanCurious</h1>
        <p class="subtitle">119th Congress</p>

        <p class="intro">
            Select a congressional district to examine how its
            representative voted when the Republican and Democratic
            majorities took opposing positions.
        </p>
    </aside>
</div>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>
    const map = L.map("map", {
        zoomControl: true
    }).setView([38.5, -96], 4);

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 18,
            attribution: "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);


    function percent(value) {
        if (value === null || value === undefined) {
            return "—";
        }

        return (value * 100).toFixed(1) + "%";
    }


    function number(value) {
        if (value === null || value === undefined) {
            return "—";
        }

        return Number(value).toLocaleString();
    }


    function partyName(code) {
        if (code === "R") {
            return "Republican";
        }

        if (code === "D") {
            return "Democratic";
        }

        return code || "Unknown";
    }


    function districtLabel(properties) {
        return `${properties.state}-${properties.district}`;
    }


    let historyData = null;
    let selectedPeriodKey = "all_available:2017_present";
    let selectedDistrictProperties = null;
    let selectedHistoryView = "congress";
    let districtGeoJsonLayer = null;
    const districtLayerByBioguide = new Map();
    let selectedDistrictLayer = null;


    function highlightDistrictLayer(layer) {
        if (
            selectedDistrictLayer &&
            selectedDistrictLayer !== layer
        ) {
            selectedDistrictLayer.setStyle(
                districtStyle()
            );
        }

        selectedDistrictLayer = layer;

        if (selectedDistrictLayer) {
            selectedDistrictLayer.setStyle({
                weight: 3
            });

            if (
                typeof selectedDistrictLayer.bringToFront ===
                "function"
            ) {
                selectedDistrictLayer.bringToFront();
            }
        }
    }


    function normalizeSearchText(value) {
        return String(value || "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase()
            .replace(/&/g, " and ")
            .replace(/[^a-z0-9]+/g, " ")
            .trim()
            .replace(/\s+/g, " ");
    }


    function compactSearchText(value) {
        return normalizeSearchText(value).replace(/\s+/g, "");
    }


    function searchTextMatches(haystack, query) {
        const normalizedQuery = normalizeSearchText(query);

        if (!normalizedQuery) {
            return true;
        }

        const normalizedHaystack =
            normalizeSearchText(haystack);

        if (normalizedHaystack.includes(normalizedQuery)) {
            return true;
        }

        const compactQuery =
            compactSearchText(query);

        const compactHaystack =
            compactSearchText(haystack);

        return (
            compactQuery.length > 0 &&
            compactHaystack.includes(compactQuery)
        );
    }


    function formatDate(dateString) {
        if (!dateString) {
            return "";
        }

        const parts = dateString.split("-");

        if (parts.length !== 3) {
            return dateString;
        }

        const date = new Date(
            Number(parts[0]),
            Number(parts[1]) - 1,
            Number(parts[2])
        );

        return date.toLocaleDateString(
            "en-US",
            {
                month: "short",
                day: "numeric",
                year: "numeric"
            }
        );
    }


    function periodOptions() {
        if (!historyData) {
            return "";
        }

        let html = "";
        let currentGroup = null;

        for (const key of historyData.period_order) {
            const period = historyData.periods[key];

            if (period.group !== currentGroup) {
                if (currentGroup !== null) {
                    html += "</optgroup>";
                }

                currentGroup = period.group;

                html += `
                    <optgroup label="${period.group}">
                `;
            }

            const selected =
                key === selectedPeriodKey
                    ? " selected"
                    : "";

            html += `
                <option value="${key}"${selected}>
                    ${period.label}
                </option>
            `;
        }

        if (currentGroup !== null) {
            html += "</optgroup>";
        }

        return html;
    }


    function periodDateText(period) {
        if (!period) {
            return "";
        }

        const start = formatDate(period.start_date);
        const end = formatDate(period.end_date);

        if (!start || !end) {
            return "";
        }

        return `${start} – ${end}`;
    }


    function memberPeriodDateText(period, record) {
        if (
            record &&
            record.first_vote_date &&
            record.last_vote_date
        ) {
            return (
                formatDate(record.first_vote_date) +
                " &#8211; " +
                formatDate(record.last_vote_date)
            );
        }

        return periodDateText(period);
    }


    function renderStats(record) {
        return `
            <div class="section-label">
                WHEN THE PARTIES DISAGREED
            </div>

            <p class="section-explainer">
                Roll calls where Republican and Democratic
                voting majorities took opposite positions.
            </p>

            <div class="stat">
                <div class="stat-label">
                    Voted with own party majority
                </div>

                <div class="stat-value">
                    ${percent(record.unity_rate)}
                </div>

                <div class="stat-detail">
                    ${number(record.with_party)}
                    of
                    ${number(record.votes_cast)}
                    votes cast
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">
                    Voted against own party majority
                </div>

                <div class="stat-value">
                    ${percent(record.opposition_rate)}
                </div>

                <div class="stat-detail">
                    ${number(record.against_party)}
                    of
                    ${number(record.votes_cast)}
                    votes cast
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">
                    Did not vote
                </div>

                <div class="stat-value">
                    ${number(record.not_voting)}
                </div>

                <div class="stat-detail">
                    of
                    ${number(record.opportunities)}
                    qualifying roll calls
                </div>
            </div>

            <div class="stat">
                <div class="stat-label">
                    Participation
                </div>

                <div class="stat-value">
                    ${percent(record.participation_rate)}
                </div>

                <div class="stat-detail">
                    ${number(record.votes_cast)}
                    of
                    ${number(record.opportunities)}
                    qualifying roll calls
                </div>
            </div>
        `;
    }


    function methodologyHtml() {
        return `
            <div class="methodology">
                <h3>About these numbers</h3>

                <p>
                    <strong>What is a qualifying roll call?</strong><br>
                    A roll call qualifies when a majority of
                    Republicans casting a Yea or Nay vote took one
                    position and a majority of Democrats casting a
                    Yea or Nay vote took the opposite position.
                </p>

                <p>
                    <strong>With or against party</strong><br>
                    A representative is counted as voting with their
                    party when their Yea or Nay vote matches the
                    majority position of their party at the time of
                    the vote, and against their party when it does not.
                </p>

                <p>
                    <strong>Not voting and participation</strong><br>
                    Present and Not Voting responses are not included
                    in the with-party or against-party percentages.
                    Participation shows the share of qualifying roll
                    calls on which the representative cast a Yea or
                    Nay vote.
                </p>

                <p>
                    <strong>Historical periods</strong><br>
                    Congress periods use all available roll calls from
                    that Congress. Presidential periods are divided
                    using the date of each roll call. Trump I begins
                    Jan. 20, 2017; Biden begins Jan. 20, 2021; and
                    Trump II begins Jan. 20, 2025.
                </p>

                <p>
                    <strong>Current map, historical voting records</strong><br>
                    The map shows districts and representatives from
                    the 119th Congress. Historical selections show the
                    voting record of that current representative when
                    they served during the selected period. A current
                    representative who did not serve in a selected
                    period will have no record for that period.
                </p>

                <p>
                    <strong>Territorial members</strong><br>
                    Territorial delegates and the resident commissioner
                    may appear in the underlying Clerk roll-call data.
                    Their votes do not alter whether a roll call
                    qualifies unless they change a major party's
                    Yea/Nay majority position.
                </p>
            </div>
        `;
    }


    function historyViewLabel(view) {
        if (view === "congress") {
            return "Congress";
        }

        if (view === "year") {
            return "Year";
        }

        if (view === "presidential") {
            return "Presidential term";
        }

        return view;
    }


    function historyRecordsForMember(bioguideId, view) {
        if (!historyData || !bioguideId) {
            return [];
        }

        const records = [];

        for (const key of historyData.period_order) {
            const period = historyData.periods[key];

            if (period.type !== view) {
                continue;
            }

            const record = period.members[bioguideId];

            if (!record) {
                continue;
            }

            records.push({
                key,
                period,
                record
            });
        }

        return records;
    }


    function historyPartyClass(record) {
        if (record.party_code === "R") {
            return "party-r";
        }

        if (record.party_code === "D") {
            return "party-d";
        }

        return "party-i";
    }


    function memberHistoryDateText(bioguideId) {
        if (!historyData || !bioguideId) {
            return "";
        }

        const overallPeriod =
            historyData.periods["all_available:2017_present"];

        if (!overallPeriod) {
            return "";
        }

        const record =
            overallPeriod.members[bioguideId];

        if (
            !record ||
            !record.first_vote_date ||
            !record.last_vote_date
        ) {
            return "";
        }

        return (
            formatDate(record.first_vote_date) +
            " &#8211; " +
            formatDate(record.last_vote_date)
        );
    }


    function renderHistoryChart(properties) {
        const chart =
            document.getElementById("history-chart");

        if (
            !historyData ||
            !properties ||
            !properties.bioguide_id
        ) {
            chart.innerHTML = `
                <div class="history-empty">
                    Select a congressional district to view its
                    voting record over time.
                </div>
            `;

            return;
        }

        const rows = historyRecordsForMember(
            properties.bioguide_id,
            selectedHistoryView
        );

        if (rows.length === 0) {
            chart.innerHTML = `
                <div class="history-header">
                    <div>
                        <h3 class="history-title">
                            Voting record over time
                        </h3>
                    </div>

                    ${historyViewControl()}
                </div>

                <div class="history-empty">
                    No ${historyViewLabel(
                        selectedHistoryView
                    ).toLowerCase()} history is available for
                    ${properties.official_name}.
                </div>
            `;

            bindHistoryViewControl(properties);
            return;
        }

        let bars = "";

        for (const item of rows) {
            const record = item.record;
            const partyClass =
                historyPartyClass(record);

            const withPercent =
                record.unity_rate === null
                    ? 0
                    : record.unity_rate * 100;

            const againstPercent =
                record.opposition_rate === null
                    ? 0
                    : record.opposition_rate * 100;

            const title =
                `${item.period.label}: ` +
                `${number(record.with_party)} with party, ` +
                `${number(record.against_party)} against party ` +
                `of ${number(record.votes_cast)} votes cast`;

            bars += `
                <div class="history-row">
                    <div
                        class="history-row-label"
                        title="${item.period.label}"
                    >
                        ${item.period.label}
                    </div>

                    <div
                        class="history-bar"
                        title="${title}"
                    >
                        <div
                            class="history-segment with-party ${partyClass}"
                            style="width: ${withPercent}%"
                        ></div>

                        <div
                            class="history-segment against-party ${partyClass}"
                            style="width: ${againstPercent}%"
                        ></div>
                    </div>

                    <div class="history-row-value">
                        <strong>
                            ${percent(record.opposition_rate)}
                        </strong>
                        against
                    </div>
                </div>
            `;
        }

        const firstRecord = rows[0].record;
        const legendPartyClass =
            historyPartyClass(firstRecord);

        chart.innerHTML = `
            <div class="history-header">
                <div>
                    <h3 class="history-title">
                        Voting record over time
                    </h3>

                    <p class="history-subtitle">
                        Share of qualifying Yea/Nay votes cast
                        with or against the representative's
                        party majority.
                        ${memberHistoryDateText(
                            properties.bioguide_id
                        )
                            ? `<br>Available record: ${
                                memberHistoryDateText(
                                    properties.bioguide_id
                                )
                            }`
                            : ""}
                    </p>
                </div>

                ${historyViewControl()}
            </div>

            <div class="history-bars">
                ${bars}
            </div>

            <div class="history-legend">
                <span class="history-legend-item">
                    <span
                        class="history-swatch history-segment with-party ${legendPartyClass}"
                    ></span>
                    With own party
                </span>

                <span class="history-legend-item">
                    <span
                        class="history-swatch history-segment against-party ${legendPartyClass}"
                    ></span>
                    Against own party
                </span>
            </div>
        `;

        bindHistoryViewControl(properties);

        requestAnimationFrame(() => {
            map.invalidateSize();
        });
    }

    const DETAIL_PAGE_SIZE = 25;

    let detailState = {
        data: null,
        properties: null,
        category: "against_own_party_majority",
        congress: "all",
        query: "",
        visible: DETAIL_PAGE_SIZE
    };


    function detailCategoryLabel(category) {
        if (category === "against_own_party_majority") {
            return "Against own party majority";
        }

        if (category === "against_both_party_majorities") {
            return "Against both party majorities";
        }

        if (category === "not_voting") {
            return "Did not vote";
        }

        return category;
    }


    function detailCategoryOptions() {
        const categories = [
            "against_own_party_majority",
            "against_both_party_majorities",
            "not_voting"
        ];

        return categories.map(category => {
            const selected =
                category === detailState.category
                    ? " selected"
                    : "";

            return `
                <option value="${category}"${selected}>
                    ${detailCategoryLabel(category)}
                </option>
            `;
        }).join("");
    }


    function detailCongressKeys() {
        if (
            !detailState.data ||
            !detailState.data.categories ||
            !detailState.data.categories[
                detailState.category
            ]
        ) {
            return [];
        }

        return Object.keys(
            detailState.data.categories[
                detailState.category
            ]
        ).sort(
            (a, b) => Number(b) - Number(a)
        );
    }


    function detailCongressOptions() {
        const congresses = detailCongressKeys();

        let html = `
            <option
                value="all"
                ${detailState.congress === "all"
                    ? " selected"
                    : ""}
            >
                All available
            </option>
        `;

        for (const congress of congresses) {
            const selected =
                detailState.congress === congress
                    ? " selected"
                    : "";

            html += `
                <option value="${congress}"${selected}>
                    ${congress}th Congress
                </option>
            `;
        }

        return html;
    }


    function detailVotes() {
        const categoryData =
            detailState.data.categories[
                detailState.category
            ] || {};

        if (detailState.congress !== "all") {
            return (
                categoryData[detailState.congress] || []
            );
        }

        const congresses = Object.keys(
            categoryData
        ).sort(
            (a, b) => Number(b) - Number(a)
        );

        const votes = [];

        for (const congress of congresses) {
            votes.push(
                ...categoryData[congress]
            );
        }

        const query =
            normalizeSearchText(detailState.query);

        if (!query) {
            return votes;
        }

        return votes.filter(vote => {
            const searchableText = [
                vote.legislation_number,
                vote.vote_question,
                vote.vote_description,
                vote.congress,
                vote.roll_number,
                vote.date
            ]
                .filter(Boolean)
                .join(" ");

            return searchTextMatches(
                searchableText,
                detailState.query
            );
        });
    }


    function detailRecordHtml(vote) {
        const legislation =
            vote.legislation_number ||
            "House roll call";

        const question =
            vote.vote_question
                ? `
                    <p class="detail-question">
                        ${vote.vote_question}
                    </p>
                `
                : "";

        const description =
            vote.vote_description
                ? `
                    <p class="detail-description">
                        ${vote.vote_description}
                    </p>
                `
                : "";

        return `
            <article class="detail-record">
                <div class="detail-record-meta">
                    ${formatVoteDetailDate(vote.date)}
                    &bull;
                    ${vote.congress}th Congress
                    &bull;
                    Roll Call ${number(vote.roll_number)}
                </div>

                <h4>${legislation}</h4>

                ${question}
                ${description}

                <div class="detail-positions">
                    <div class="detail-position">
                        <span class="detail-position-label">
                            Member vote
                        </span>

                        <span class="detail-position-value">
                            ${vote.vote || "?"}
                        </span>
                    </div>

                    <div class="detail-position">
                        <span class="detail-position-label">
                            Republican majority
                        </span>

                        <span class="detail-position-value">
                            ${vote.republican_position || "?"}
                        </span>
                    </div>

                    <div class="detail-position">
                        <span class="detail-position-label">
                            Democratic majority
                        </span>

                        <span class="detail-position-value">
                            ${vote.democratic_position || "?"}
                        </span>
                    </div>
                </div>

                <a
                    class="detail-clerk-link"
                    href="${vote.clerk_url}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    View official House Clerk roll call &rarr;
                </a>
            </article>
        `;
    }


    function formatVoteDetailDate(dateString) {
        if (!dateString) {
            return "";
        }

        const match = String(dateString).match(
            /^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/
        );

        if (!match) {
            return dateString;
        }

        const day = Number(match[1]);
        const month = match[2];
        const year = match[3];

        return `${month} ${day}, ${year}`;
    }


    function escapeHtml(value) {
        return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    async function showMemberDetail(properties) {
        const panel =
            document.getElementById("panel");

        panel.innerHTML = `
            <h2 class="member-name">
                ${properties.official_name}
            </h2>

            <p class="member-meta">
                ${partyName(properties.party)}
                &bull;
                ${districtLabel(properties)}
            </p>

            <div class="detail-status">
                Loading precompiled voting records...
            </div>
        `;

        try {
            const response = await fetch(
                `data/member_votes/${
                    properties.bioguide_id
                }.json`
            );

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}`
                );
            }

            const data =
                await response.json();

            detailState = {
                data,
                properties,
                category:
                    "against_own_party_majority",
                congress: "all",
                query: "",
                visible: DETAIL_PAGE_SIZE
            };

            renderMemberDetail();
        } catch (error) {
            console.error(error);

            panel.innerHTML = `
                <h2 class="member-name">
                    ${properties.official_name}
                </h2>

                <p class="member-meta">
                    ${partyName(properties.party)}
                    &bull;
                    ${districtLabel(properties)}
                </p>

                <div class="detail-status">
                    Voting record details could not
                    be loaded.
                </div>

                <button
                    id="member-detail-back"
                    class="member-detail-back"
                    type="button"
                >
                    &larr; Back to summary
                </button>
            `;

            document
                .getElementById(
                    "member-detail-back"
                )
                .addEventListener(
                    "click",
                    () => {
                        showDistrict(properties);
                    }
                );
        }
    }

    function memberSearchText(properties) {
        return [
            properties.official_name,
            properties.state,
            properties.district,
            districtLabel(properties),
            `${properties.state} ${properties.district}`,
            `${properties.state}${properties.district}`,
            partyName(properties.party),
            properties.party
        ]
            .filter(
                value =>
                    value !== null &&
                    value !== undefined &&
                    value !== ""
            )
            .join(" ");
    }


    function selectMemberFromSearch(properties) {
        if (!properties) {
            return;
        }

        showDistrict(properties);

        const layer =
            properties.bioguide_id
                ? districtLayerByBioguide.get(
                    properties.bioguide_id
                )
                : null;

        if (layer) {
            if (typeof layer.getBounds === "function") {
                map.fitBounds(
                    layer.getBounds(),
                    {
                        padding: [40, 40],
                        maxZoom: 8
                    }
                );
            } else if (
                typeof layer.getLatLng === "function"
            ) {
                map.setView(
                    layer.getLatLng(),
                    8
                );
            }

            highlightDistrictLayer(layer);

            if (typeof layer.openTooltip === "function") {
                layer.openTooltip();
            }
        }
    }


    function addMemberSearchControl(districtData) {
        const searchableMembers =
            districtData.features
                .map(feature => feature.properties)
                .filter(properties =>
                    properties.bioguide_id &&
                    properties.official_name
                )
                .sort((a, b) =>
                    String(a.official_name).localeCompare(
                        String(b.official_name)
                    )
                );

        const SearchControl =
            L.Control.extend({
                options: {
                    position: "topleft"
                },

                onAdd: function () {
                    const container =
                        L.DomUtil.create(
                            "div",
                            "map-search-control"
                        );

                    container.innerHTML = `
                        <input
                            class="map-search-input"
                            type="search"
                            placeholder="Search representative or district"
                            aria-label="Search representative or district"
                            autocomplete="off"
                        >
                        <div
                            class="map-search-results"
                            role="listbox"
                        ></div>
                    `;

                    L.DomEvent.disableClickPropagation(
                        container
                    );

                    L.DomEvent.disableScrollPropagation(
                        container
                    );

                    const input =
                        container.querySelector(
                            ".map-search-input"
                        );

                    const results =
                        container.querySelector(
                            ".map-search-results"
                        );

                    function hideResults() {
                        results.classList.remove(
                            "visible"
                        );
                    }

                    function choose(properties) {
                        input.value =
                            properties.official_name;

                        hideResults();

                        input.blur();

                        selectMemberFromSearch(
                            properties
                        );
                    }

                    function renderResults() {
                        const query =
                            input.value.trim();

                        if (!query) {
                            results.innerHTML = "";
                            hideResults();
                            return;
                        }

                        const matches =
                            searchableMembers
                                .filter(properties =>
                                    searchTextMatches(
                                        memberSearchText(
                                            properties
                                        ),
                                        query
                                    )
                                )
                                .slice(0, 10);

                        if (!matches.length) {
                            results.innerHTML = `
                                <div class="map-search-empty">
                                    No representatives found.
                                </div>
                            `;

                            results.classList.add(
                                "visible"
                            );

                            return;
                        }

                        results.innerHTML =
                            matches.map(
                                (properties, index) => `
                                    <button
                                        class="map-search-result"
                                        type="button"
                                        data-search-index="${index}"
                                        role="option"
                                    >
                                        <span class="map-search-result-name">
                                            ${escapeHtml(
                                                properties.official_name
                                            )}
                                        </span>
                                        <span class="map-search-result-meta">
                                            ${escapeHtml(
                                                partyName(
                                                    properties.party
                                                )
                                            )}
                                            &bull;
                                            ${escapeHtml(
                                                districtLabel(
                                                    properties
                                                )
                                            )}
                                        </span>
                                    </button>
                                `
                            ).join("");

                        results.classList.add(
                            "visible"
                        );

                        results
                            .querySelectorAll(
                                ".map-search-result"
                            )
                            .forEach(button => {
                                button.addEventListener(
                                    "click",
                                    () => {
                                        const index =
                                            Number(
                                                button.dataset.searchIndex
                                            );

                                        choose(
                                            matches[index]
                                        );
                                    }
                                );
                            });
                    }

                    input.addEventListener(
                        "input",
                        renderResults
                    );

                    input.addEventListener(
                        "keydown",
                        event => {
                            if (event.key === "Escape") {
                                hideResults();
                                input.blur();
                                return;
                            }

                            if (event.key === "Enter") {
                                const query =
                                    input.value.trim();

                                if (!query) {
                                    return;
                                }

                                const match =
                                    searchableMembers.find(
                                        properties =>
                                            searchTextMatches(
                                                memberSearchText(
                                                    properties
                                                ),
                                                query
                                            )
                                    );

                                if (match) {
                                    event.preventDefault();
                                    choose(match);
                                }
                            }
                        }
                    );

                    document.addEventListener(
                        "click",
                        event => {
                            if (
                                !container.contains(
                                    event.target
                                )
                            ) {
                                hideResults();
                            }
                        }
                    );

                    return container;
                }
            });

        map.addControl(
            new SearchControl()
        );
    }


    function districtStyle() {
        return {
            color: "#555",
            weight: 1,
            opacity: 1,
            fillColor: "#d9d9d9",
            fillOpacity: 0.65
        };
    }


    Promise.all([
        fetch("data/districts_119.geojson").then(
            response => {
                if (!response.ok) {
                    throw new Error(
                        `GeoJSON request failed: ${response.status}`
                    );
                }

                return response.json();
            }
        ),

        fetch("data/member_history.json").then(
            response => {
                if (!response.ok) {
                    throw new Error(
                        `History request failed: ${response.status}`
                    );
                }

                return response.json();
            }
        )
    ])
        .then(([districtData, history]) => {
            historyData = history;

            if (
                !historyData.periods ||
                !historyData.periods[selectedPeriodKey]
            ) {
                throw new Error(
                    "Default historical period is missing."
                );
            }

            const districts = L.geoJSON(
                districtData,
                {
                    style: districtStyle,

                    onEachFeature: (feature, layer) => {
                        const properties =
                            feature.properties;

                        layer.bindTooltip(
                            `${districtLabel(properties)} • ` +
                            (
                                properties.official_name ||
                                "Vacant"
                            ) +
                            (
                                properties.party
                                    ? ` (${properties.party})`
                                    : ""
                            ),
                            {
                                sticky: true
                            }
                        );

                        if (properties.bioguide_id) {
                            districtLayerByBioguide.set(
                                properties.bioguide_id,
                                layer
                            );
                        }

                        layer.on("click", () => {
                            showDistrict(properties);
                            highlightDistrictLayer(layer);
                        });
                    }
                }
            ).addTo(map);

            districtGeoJsonLayer = districts;

            addMemberSearchControl(
                districtData
            );

            // Keep the initial view centered on the United States.
            // Fitting all district geometry can zoom far out because
            // Alaska/Aleutian geometry crosses the antimeridian.
            map.setView(
                [38.5, -96],
                4
            );
        })
        .catch(error => {
            console.error(error);

            document.getElementById(
                "panel"
            ).innerHTML = `
                <h1>BipartisanCurious</h1>

                <p>
                    The dashboard data could not be loaded.
                </p>

                <pre>${error.message}</pre>
            `;
        });
</script>

</body>
</html>
